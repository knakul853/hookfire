version: 2
builds:
  - id: hookfire
    main: ./cmd/hookfire
    binary: hookfire
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/knakul853/hookfire/internal/cli.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
