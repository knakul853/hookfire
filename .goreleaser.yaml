version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: hookfire
    main: ./cmd/hookfire
    binary: hookfire
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/knakul853/hookfire/internal/cli.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]

release:
  draft: false
  prerelease: auto

# Homebrew is intentionally deferred (no users yet, and a tap needs a second repo
# plus a cross-repo PAT). To enable it later: create github.com/knakul853/homebrew-tap,
# add a HOMEBREW_TAP_GITHUB_TOKEN repo secret, pass it in release.yml, and add:
#
# brews:
#   - name: hookfire
#     repository: { owner: knakul853, name: homebrew-tap, token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}" }
#     homepage: "https://github.com/knakul853/hookfire"
