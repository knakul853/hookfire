# Regenerate mocks with the pinned v2 toolchain (PATH may shadow it with a v3
# whose config schema is incompatible):
#   go run github.com/vektra/mockery/v2@v2.53.4
with-expecter: true
dir: "mocks"
mockname: "Mock{{.InterfaceName}}"
outpkg: "mocks"
packages:
  github.com/knakul853/hookfire/internal/sign:
    interfaces:
      Signer:
  github.com/knakul853/hookfire/internal/provider:
    interfaces:
      Catalog:
  github.com/knakul853/hookfire/internal/config:
    interfaces:
      SecretResolver:
  github.com/knakul853/hookfire/internal/fire:
    interfaces:
      Sender:
