name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go build ./...
      - run: go test ./... -race -count=1
      - run: go test -tags e2e ./e2e/...
      - uses: golangci/golangci-lint-action@v6
        with: { version: latest }
